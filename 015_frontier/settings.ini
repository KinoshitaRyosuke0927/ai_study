[Mattermost]
- AIS事業部開発プロジェクト
  部長兼POである矢野さんを含めて共有したい情報を共有するチャンネル
  POレビューやAIS部署全体に共有したい内容がやり取りされる
- AIS_業務連絡
  開発メンバーのみで共有したい情報を共有するチャンネル
  レビュー依頼や打ち合わせのスケジュール調整、仕様の確認など様々な開発業務に関するやり取りを行う
- AIS_意見箱
  「のみどき」に限らず、AIS（部署名）の日々の活動に関する意見や疑問などを雑多に会話するためのチャンネル

[Trello]
- のみどき
  事務所においてあるウォーターサーバーの水の消費量を予測するアプリケーションの開発プロジェクトで使用するワークスペース
  「のみどき」はアプリケーションの名称
  - プロダクトバックログ
    「のみどき」の開発状況を管理するボード
  - スプリントn
    「のみどき」のスプリントnで取り組むSBIを管理するボード
- AIS_報告書
  AIS（部署名）の活動状況を管理するワークスペース
  - 48期_Nomidoki_週報・KPT
  「のみどき」の活動に関する状況記録、およびKPTによる振り返りを行うためのボード

[GitHub]
- Nomidoki
  事務所においてあるウォーターサーバーの水の消費量を予測するアプリケーションのコードを管理するリポジトリ
- Nomidoki/docs/
  プロダクトの設計書が配置されているパス

[GROWi]
- /2000_開発者向け/2000_開発者向け/2YYY_組織/AIビジネス研究室/400_のみどき_開発
  「のみどき」に関するドキュメントが配置されているディレクトリ
  設計書や開発メンバー以外に共有する情報が記載されている

