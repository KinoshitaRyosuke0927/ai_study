<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI PowerPoint レビュアー</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="container">
    <h1>AI PowerPoint レビュアー</h1>

    <div class="panels">

      <!-- ========== 左パネル ========== -->
      <div class="panel panel-left">

        <section class="section">
          <h2>PPTXをアップロード</h2>
          <div class="form-group">
            <label class="file-drop" id="file-drop">
              <input type="file" id="file-input" accept=".pptx">
              <span id="file-name" class="file-name-hint">クリックまたはドロップして<br>.pptx を選択</span>
            </label>
          </div>
          <button id="upload-btn" disabled>スライドを表示</button>
          <div id="upload-message" class="message hidden"></div>
        </section>

        <section class="section hidden" id="overall-section">
          <h2>資料全体の伝えたいこと</h2>
          <textarea
            id="intended-message"
            rows="4"
            placeholder="プレゼンテーション全体で伝えたいことを入力してください&#10;例: コスト削減施策の有効性と導入ロードマップを伝えたい"
          ></textarea>
        </section>

        <section class="section hidden" id="slide-list-section">
          <h2>スライド一覧</h2>
          <div id="slide-list" class="slide-list"></div>
        </section>

        <div class="hidden" id="review-action">
          <button id="review-btn">AIでレビューする</button>
          <div id="review-message" class="message hidden"></div>
        </div>

      </div><!-- /panel-left -->

      <div class="panel-divider"></div>

      <!-- ========== 右パネル ========== -->
      <div class="panel panel-right">

        <!-- スライド選択後のコンテンツ -->
        <div id="right-content" class="hidden">

          <!-- 全体評価（レビュー後にタブの上に表示） -->
          <div id="overall-summary-section" class="overall-summary-section hidden">
            <div class="accordion-header" id="overall-summary-toggle">
              <h3>全体評価</h3>
              <span class="accordion-chevron">▼</span>
            </div>
            <div id="overall-summary-body" class="accordion-body"></div>
          </div>

          <!-- タブバー -->
          <div class="tab-bar">
            <button class="tab-btn active" data-tab="input">伝えたいこと</button>
            <button class="tab-btn" data-tab="review">レビュー結果</button>
          </div>

          <!-- 伝えたいことタブ -->
          <div id="tab-input" class="tab-content">
            <div class="slide-panel-label" id="input-slide-label">スライド 1</div>
            <div class="slide-image-wrap">
              <img id="slide-preview-img" src="" alt="">
            </div>
            <div class="slide-input-area">
              <h3>このスライドで伝えたいこと <span class="hint-label">（任意）</span></h3>
              <p class="hint-text">省略した場合は全体の伝えたいことが適用されます</p>
              <textarea
                id="slide-message-input"
                rows="5"
                placeholder="このスライドで特に伝えたいことを入力してください"
              ></textarea>
            </div>
          </div>

          <!-- レビュー結果タブ -->
          <div id="tab-review" class="tab-content hidden">
            <div id="review-slide-placeholder" class="placeholder-text">
              「AIでレビューする」を実行すると結果が表示されます
            </div>
            <div id="review-slide-content" class="hidden">
              <div class="slide-panel-label" id="review-slide-label">スライド 1</div>
              <div class="slide-image-wrap">
                <img id="review-slide-img" src="" alt="">
              </div>
              <div id="review-slide-details"></div>
            </div>
          </div>

        </div><!-- /right-content -->

      </div><!-- /panel-right -->

    </div><!-- /panels -->
  </div><!-- /container -->

  <script src="/static/app.js"></script>
</body>
</html>
