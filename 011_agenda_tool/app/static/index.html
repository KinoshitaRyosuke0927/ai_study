<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>アジェンダ作成ツール</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="container">
    <div class="header-row">
      <h1>アジェンダ作成ツール</h1>
      <button type="button" id="gs-login-open-btn" class="btn gs-login-open-btn">GROUPSESSIONログイン</button>
      <div class="filter-strength-group">
        <label for="filter-strength-slider">フィルタ強度: <span id="filter-strength-value">0.5</span></label>
        <input type="range" id="filter-strength-slider" min="0" max="1" step="0.1" value="0.5">
        <span class="tooltip-icon" tabindex="0">?
          <span class="tooltip-text">取得した投稿・記事からリマインドが必要な投稿を抽出する際の、絞り込みの強さを0(弱い)から1(強い)で設定します。</span>
        </span>
      </div>
    </div>

    <!-- ========== アジェンダ ========== -->
    <div id="tab-agenda" class="tab-content active">
      <div class="panels">

        <!-- ========== 左: 期間選択 + 取得した投稿一覧 ========== -->
        <div class="panel panel-left">

          <section class="section">
            <h2>期間を選択</h2>
            <div class="form-row">
              <div class="form-group">
                <label for="agenda-start-date">取得開始日</label>
                <input type="date" id="agenda-start-date">
              </div>
              <div class="form-group">
                <label for="agenda-end-date">取得終了日</label>
                <input type="date" id="agenda-end-date">
              </div>
            </div>
            <button id="agenda-fetch-btn" class="btn" disabled>履歴・新着記事を取得</button>
            <div id="agenda-message" class="message hidden"></div>
          </section>

          <section class="section last post-list-section">
            <div class="detail-header">
              <h2>取得した投稿一覧</h2>
              <div class="agenda-sort-buttons">
                <button type="button" id="agenda-sort-date-btn" class="btn sort-btn">日時順</button>
                <button type="button" id="agenda-sort-username-btn" class="btn sort-btn">投稿者順</button>
                <button type="button" id="agenda-sort-source-btn" class="btn sort-btn">取得元順</button>
              </div>
            </div>
            <div id="agenda-post-list" class="post-list">
              <p class="post-list-placeholder">履歴・新着記事を取得すると一覧が表示されます</p>
            </div>
          </section>

        </div><!-- /panel-left -->

        <div class="panel-divider"></div>

        <!-- ========== 右: 詳細内容 ========== -->
        <div class="panel panel-right">

          <section class="section detail-section agenda-detail-section" id="agenda-top-section">
            <div class="detail-header">
              <h2>詳細内容</h2>
              <button id="agenda-create-btn" class="btn reminder-btn" disabled>アジェンダを作成</button>
            </div>
            <div id="agenda-post-detail" class="post-detail">
              <p class="post-detail-placeholder">左の一覧から投稿・記事を選択してください</p>
            </div>
            <div id="agenda-detail-message" class="message hidden"></div>
          </section>

          <div class="v-resizer" data-prev="agenda-top-section" data-next="agenda-bottom-section"></div>

          <section class="section last agenda-output-section" id="agenda-bottom-section">
            <h2>部会アジェンダ</h2>
            <textarea id="agenda-output" placeholder="チェックした投稿・記事を選び「アジェンダを作成」を押すと、ここに文章が作成されます"></textarea>
            <div id="agenda-output-message" class="message hidden"></div>

            <div class="form-row agenda-publish-row">
              <div class="form-group agenda-publish-year-group">
                <label for="agenda-publish-year">公開先: 年</label>
                <input type="number" id="agenda-publish-year" min="2000" max="2100">
              </div>
              <div class="form-group agenda-publish-month-group">
                <label for="agenda-publish-month">公開先: 月</label>
                <input type="number" id="agenda-publish-month" min="1" max="12">
              </div>
              <div class="form-group agenda-publish-grant-group">
                <label for="agenda-publish-grant-toggle">公開範囲</label>
                <div class="toggle-switch-row">
                  <span class="toggle-switch-label">公開</span>
                  <label class="toggle-switch">
                    <input type="checkbox" id="agenda-publish-grant-toggle">
                    <span class="toggle-switch-slider"></span>
                  </label>
                  <span class="toggle-switch-label">自分のみ公開</span>
                </div>
              </div>
              <div class="form-group agenda-publish-btn-group">
                <button id="agenda-publish-btn" class="btn" disabled>wikiへ公開</button>
                <span class="tooltip-icon" tabindex="0">?
                  <span class="tooltip-text">すでに公開されているページの公開範囲を変更する場合、該当記事を一度削除するためURLが変更になるのでご注意ください。</span>
                </span>
              </div>
            </div>
            <div id="agenda-publish-message" class="message hidden"></div>
          </section>

        </div><!-- /panel-right -->

      </div><!-- /panels -->
    </div><!-- /tab-agenda -->

  </div><!-- /container -->

  <!-- ========== GROUPSESSIONログイン モーダル ========== -->
  <div id="gs-login-modal-overlay" class="modal-overlay hidden">
    <div class="modal-box">
      <h2>GROUPSESSIONログイン</h2>
      <div class="form-group">
        <label for="gs-login-username">ID</label>
        <input type="text" id="gs-login-username" class="dm-target-value" autocomplete="username">
      </div>
      <div class="form-group">
        <label for="gs-login-password">パスワード</label>
        <input type="password" id="gs-login-password" class="dm-target-value" autocomplete="current-password">
      </div>
      <div id="gs-login-message" class="message hidden"></div>
      <div class="modal-actions">
        <button type="button" id="gs-login-cancel-btn" class="btn modal-cancel-btn">キャンセル</button>
        <button type="button" id="gs-login-btn" class="btn">ログイン</button>
      </div>
    </div>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
