<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>コミュニケーション練習ツール</title>
  <link rel="stylesheet" href="/static/style.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
</head>
<body>
  <header>
    <h1>コミュニケーション練習ツール</h1>
    <span id="conn-status" class="badge">未接続</span>
  </header>

  <main>
    <!-- 左: 設定と状態 -->
    <section class="panel side-panel">
      <label>会話相手
        <select id="persona"></select>
      </label>

      <label>性別
        <select id="gender"></select>
      </label>

      <label>シチュエーション
        <select id="scenario"></select>
      </label>

      <div class="buttons">
        <button id="start-btn">会話を開始</button>
        <button id="stop-btn" disabled>終了</button>
      </div>
      <button id="report-btn" class="secondary" disabled>振り返りレポートを見る</button>

      <div class="status">
        <div><span id="user-indicator" class="dot"></span>あなた</div>
        <div><span id="ai-indicator" class="dot"></span>相手</div>
        <div>経過 <span id="timer">00:00</span> / <span id="timer-max">--:--</span></div>
        <div>割り込み <span id="interrupt-count">0</span> 回</div>
      </div>
    </section>

    <!-- 中央: 相手のカメラ映像（表情）・会話相手とシチュエーション・気持ち -->
    <div class="center-col">
      <section class="video-tile" id="video-tile" role="button" tabindex="0" aria-pressed="false"
               aria-label="会話相手の表情。クリックで相手の音声をオン・オフ" title="クリックで相手の音声をオン/オフ">
        <img id="face" alt="">
        <span class="video-name" id="video-name"></span>
        <span class="video-audio" id="video-audio">🔊 音声オン</span>
      </section>

      <section class="panel situation-panel">
        <div class="situation-block">
          <h2>会話相手: <span id="persona-name"></span></h2>
          <p id="persona-desc"></p>
        </div>
        <div class="situation-block">
          <h2>シチュエーション: <span id="situation-title"></span></h2>
          <p id="situation"></p>
        </div>
      </section>

      <section class="panel emotion-panel">
        <h2><span id="emotion-title">相手</span>の気持ち <span id="eval-status" class="eval-status"></span></h2>
        <div class="emotion-body">
          <div id="meters" class="meters"></div>
          <div class="chart-wrap">
            <canvas id="emotion-chart" aria-label="発話ごとの感情の推移"></canvas>
          </div>
        </div>
      </section>
    </div>

    <!-- 右: 会話ログ -->
    <section class="panel log-panel">
      <h2>会話ログ</h2>
      <div id="log" class="log"></div>
    </section>
  </main>

  <!-- 振り返りレポート -->
  <dialog id="report-dialog">
    <div class="report-head">
      <h2>振り返りレポート</h2>
      <div class="report-actions">
        <button id="report-download" class="secondary" disabled>レポートダウンロード</button>
        <button id="report-close" class="secondary" aria-label="閉じる">閉じる</button>
      </div>
    </div>
    <div id="report-body"></div>
  </dialog>

  <audio id="remote-audio" autoplay></audio>
  <script src="/static/voice-analyzer.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>
