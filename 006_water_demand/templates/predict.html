<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>注文量予測</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: "Hiragino Kaku Gothic ProN", "Meiryo", sans-serif;
      background: #f0f4f8;
      min-height: 100vh;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 40px 16px;
    }

    .container {
      background: #ffffff;
      border-radius: 16px;
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.1);
      padding: 40px 48px;
      width: 960px;
    }

    .header {
      display: flex;
      align-items: center;
      margin-bottom: 28px;
    }

    .btn-back-arrow {
      font-size: 1.2rem;
      color: #64748b;
      text-decoration: none;
      line-height: 1;
      margin-right: 10px;
      transition: color 0.15s;
    }

    .btn-back-arrow:hover { color: #1a2e44; }

    h1 {
      font-size: 1.4rem;
      font-weight: 700;
      color: #1a2e44;
    }

    .section-title {
      font-size: 0.875rem;
      font-weight: 700;
      color: #475569;
      margin-bottom: 10px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.9rem;
      margin-bottom: 28px;
    }

    thead th {
      background: #f8fafc;
      color: #475569;
      font-weight: 600;
      padding: 9px 14px;
      text-align: left;
      border-bottom: 2px solid #e2e8f0;
      white-space: nowrap;
    }

    tbody tr { border-bottom: 1px solid #e2e8f0; }
    tbody tr:last-child { border-bottom: none; }

    tbody td {
      padding: 10px 14px;
      color: #1a2e44;
      white-space: nowrap;
    }

    .btn-predict {
      display: block;
      width: 100%;
      padding: 13px;
      background: #3b82f6;
      color: #ffffff;
      border: none;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.15s;
      margin-bottom: 24px;
    }

    .btn-predict:hover  { background: #2563eb; }
    .btn-predict:disabled { background: #93c5fd; cursor: not-allowed; }

    /* 結果カード */
    #result-area { display: none; }

    .result-card {
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      overflow: hidden;
    }

    .result-header {
      background: #eff6ff;
      padding: 12px 18px;
      font-size: 0.875rem;
      font-weight: 700;
      color: #1d4ed8;
    }

    .result-rows { padding: 4px 0; }

    .result-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 18px;
      border-bottom: 1px solid #f1f5f9;
      font-size: 0.9rem;
    }

    .result-row:last-child { border-bottom: none; }

    .result-label { color: #475569; }
    .result-value { color: #1a2e44; font-weight: 600; }

    .result-row.highlight {
      background: #eff6ff;
      padding: 14px 18px;
    }

    .result-row.highlight .result-label { color: #1d4ed8; font-weight: 700; }
    .result-row.highlight .result-value {
      color: #1d4ed8;
      font-size: 1.3rem;
      font-weight: 800;
    }

    .error-msg {
      padding: 14px 18px;
      color: #dc2626;
      font-size: 0.9rem;
      font-weight: 600;
    }

    .result-footer {
      padding: 14px 18px;
      border-top: 1px solid #e2e8f0;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .btn-register {
      background: #10b981;
      color: #ffffff;
      border: none;
      padding: 8px 20px;
      border-radius: 8px;
      font-size: 0.875rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
    }

    .btn-register:hover    { background: #059669; }
    .btn-register:disabled { background: #6ee7b7; cursor: not-allowed; }

    .btn-fetch-weather {
      background: #f0fdf4;
      color: #166534;
      border: 1px solid #bbf7d0;
      padding: 5px 12px;
      border-radius: 6px;
      font-size: 0.8rem;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.15s;
    }

    .btn-fetch-weather:hover    { background: #dcfce7; }
    .btn-fetch-weather:disabled { background: #f0fdf4; color: #6ee7b7; cursor: not-allowed; }

    .register-msg {
      font-size: 0.85rem;
      font-weight: 600;
    }

    .btn-edit-link {
      display: inline-block;
      padding: 5px 12px;
      border: none;
      border-radius: 6px;
      font-size: 0.82rem;
      cursor: pointer;
      background: #e2e8f0;
      color: #334155;
      text-decoration: none;
      transition: background 0.15s;
    }

    .btn-edit-link:hover { background: #cbd5e1; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <a href="/" class="btn-back-arrow">←</a>
      <h1>注文量予測</h1>
    </div>

    <p class="section-title">使用データ</p>
    <table>
      <thead>
        <tr>
          <th>データ</th>
          <th>参照期間</th>
          <th>更新日時</th>
          <th>操作</th>
        </tr>
      </thead>
      <tbody id="data-info-body">
        {% for row in info %}
        <tr>
          <td>{{ row.name }}</td>
          <td>{{ row.period }}</td>
          <td>{{ row.mtime }}</td>
          <td>
            {% if row.name == '水の注文量実績' %}
            <a href="/water_demand" class="btn-edit-link">編集</a>
            {% elif row.name == 'AIC出社カレンダー' %}
            <a href="/work_day" class="btn-edit-link">編集</a>
            {% elif row.name == '気候情報' %}
            <button class="btn-fetch-weather" id="btn-fetch-weather" onclick="updateWeather()">最新情報を取得</button>
            {% endif %}
          </td>
        </tr>
        {% endfor %}
      </tbody>
    </table>

    <button class="btn-predict" id="btn-predict" onclick="predict()">注文量を予測</button>

    <div id="result-area">
      <div class="result-card" id="result-card"></div>
    </div>
  </div>

  <script>
    let lastPrediction = null;

    async function predict() {
      const btn = document.getElementById('btn-predict');
      btn.disabled = true;
      btn.textContent = '予測中...';

      const res = await fetch('/predict/run', { method: 'POST' });
      const data = await res.json();

      btn.disabled = false;
      btn.textContent = '注文量を予測';

      const card = document.getElementById('result-card');
      const area = document.getElementById('result-area');
      area.style.display = 'block';

      if (data.error) {
        card.innerHTML = `<div class="error-msg">⚠ ${data.error}</div>`;
        lastPrediction = null;
        return;
      }

      lastPrediction = data;

      card.innerHTML = `
        <div class="result-header">予測結果 — ${data.target_month}</div>
        <div class="result-rows">
          <div class="result-row">
            <span class="result-label">営業日数</span>
            <span class="result-value">${data.business_days} 日</span>
          </div>
          <div class="result-row">
            <span class="result-label">1日あたり出社人数</span>
            <span class="result-value">${data.attendance_rate} 人/日</span>
          </div>
          <div class="result-row">
            <span class="result-label">月平均気温（前年同月実績）</span>
            <span class="result-value">${data.tavg_prev_year} ℃</span>
          </div>
          <div class="result-row">
            <span class="result-label">予測注文量</span>
            <span class="result-value">${data.prediction} L</span>
          </div>
          <div class="result-row highlight">
            <span class="result-label">推奨注文量（20L単位）</span>
            <span class="result-value">${data.prediction_rounded} L</span>
          </div>
        </div>
        <div class="result-footer">
          <button class="btn-register" id="btn-register" onclick="registerResult()">推奨注文量を実績として登録</button>
          <span class="register-msg" id="register-msg"></span>
        </div>
      `;
    }

    async function registerResult() {
      if (!lastPrediction) return;
      const btn = document.getElementById('btn-register');
      btn.disabled = true;

      const res = await fetch('/predict/register', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          date_ym: lastPrediction.date_ym_csv,
          order_quantity: lastPrediction.prediction_rounded,
        }),
      });

      const msg = document.getElementById('register-msg');
      if (res.ok) {
        msg.style.color = '#059669';
        msg.textContent = '登録しました';
        await refreshDataInfo();
      } else {
        btn.disabled = false;
        msg.style.color = '#dc2626';
        msg.textContent = '登録に失敗しました';
      }
    }

    async function refreshDataInfo() {
      const res = await fetch('/predict/data-info');
      if (!res.ok) return;
      const rows = await res.json();
      const tbody = document.getElementById('data-info-body');
      tbody.innerHTML = rows.map(r => {
        let action = '';
        if (r.name === '水の注文量実績') {
          action = '<a href="/water_demand" class="btn-edit-link">編集</a>';
        } else if (r.name === 'AIC出社カレンダー') {
          action = '<a href="/work_day" class="btn-edit-link">編集</a>';
        } else if (r.name === '気候情報') {
          action = '<button class="btn-fetch-weather" id="btn-fetch-weather" onclick="updateWeather()">最新情報を取得</button>';
        }
        return `
        <tr>
          <td>${r.name}</td>
          <td>${r.period}</td>
          <td>${r.mtime}</td>
          <td>${action}</td>
        </tr>`;
      }).join('');
    }

    async function updateWeather() {
      const btn = document.getElementById('btn-fetch-weather');
      btn.disabled = true;
      btn.textContent = '取得中...';

      const res = await fetch('/predict/update-weather', { method: 'POST' });
      const data = await res.json();

      if (res.ok) {
        await refreshDataInfo();
      } else {
        alert(data.error || '取得に失敗しました');
        btn.disabled = false;
        btn.textContent = '最新情報を取得';
      }
    }
  </script>
</body>
</html>
