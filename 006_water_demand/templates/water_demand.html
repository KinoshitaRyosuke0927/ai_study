<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>水の注文量登録</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: "Hiragino Kaku Gothic ProN", "Meiryo", sans-serif;
      background: #f0f4f8;
      min-height: 100vh;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 40px 16px;
    }

    .container {
      background: #ffffff;
      border-radius: 16px;
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.1);
      padding: 40px 48px;
      width: 760px;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .btn-back-arrow {
      font-size: 1.2rem;
      color: #64748b;
      text-decoration: none;
      line-height: 1;
      transition: color 0.15s;
    }

    .btn-back-arrow:hover { color: #1a2e44; }

    h1 {
      font-size: 1.4rem;
      font-weight: 700;
      color: #1a2e44;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .actions {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 8px;
    }

    .msg {
      font-size: 0.875rem;
      color: #16a34a;
      font-weight: 600;
      min-height: 1.4em;
      margin-bottom: 16px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.9rem;
    }

    thead th {
      background: #f8fafc;
      color: #475569;
      font-weight: 600;
      padding: 10px 12px;
      text-align: left;
      border-bottom: 2px solid #e2e8f0;
    }

    tbody tr { border-bottom: 1px solid #e2e8f0; }
    tbody tr:last-child { border-bottom: none; }

    tbody td {
      padding: 10px 12px;
      color: #1a2e44;
      vertical-align: middle;
    }

    input[type="number"],
    input[type="month"] {
      width: 100%;
      padding: 6px 8px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      font-size: 0.9rem;
      color: #1a2e44;
      outline: none;
      transition: border-color 0.15s;
    }

    input[type="number"]:focus,
    input[type="month"]:focus { border-color: #3b82f6; }

    .btn {
      padding: 5px 12px;
      border: none;
      border-radius: 6px;
      font-size: 0.82rem;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s;
    }

    .btn:active { transform: translateY(1px); }

    .btn-edit    { background: #e2e8f0; color: #334155; }
    .btn-edit:hover { background: #cbd5e1; }

    .btn-confirm { background: #dbeafe; color: #1d4ed8; }
    .btn-confirm:hover { background: #bfdbfe; }

    .btn-delete  { background: #fee2e2; color: #b91c1c; }
    .btn-delete:hover { background: #fecaca; }

    .op-cell { display: flex; gap: 6px; }

    .btn-add {
      background: #f0fdf4;
      color: #166534;
      border: 1px solid #bbf7d0;
      padding: 8px 18px;
      border-radius: 8px;
      font-size: 0.9rem;
      cursor: pointer;
      transition: background 0.15s;
    }

    .btn-add:hover { background: #dcfce7; }

    .btn-register {
      background: #3b82f6;
      color: #ffffff;
      border: none;
      padding: 9px 24px;
      border-radius: 8px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
    }

    .btn-register:hover { background: #2563eb; }

  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="header-left">
        <a href="/" class="btn-back-arrow">←</a>
        <h1>水の注文量登録</h1>
      </div>
      <div class="header-actions">
        <button class="btn-register" onclick="register()">登録</button>
      </div>
    </div>
    <p class="msg" id="msg"></p>

    <div class="actions">
      <button class="btn-add" onclick="addMonth()">＋ 月追加</button>
    </div>

    <table>
      <thead>
        <tr>
          <th style="width:130px">年月</th>
          <th style="width:160px">注文量 (L)</th>
          <th style="width:160px">残量 (L)</th>
          <th>操作</th>
        </tr>
      </thead>
      <tbody id="table-body">
        {% for row in rows %}
        <tr data-mode="view" data-date="{{ row.date_ym }}">
          <td class="cell-date">{{ row.date_ym[:4] }}年{{ row.date_ym[5:7]|int }}月</td>
          <td>
            <span class="view-text">{{ row.order_quantity }}</span>
            <input class="edit-input" type="number" step="0.1" min="0"
                   value="{{ row.order_quantity }}" style="display:none" />
          </td>
          <td>
            <span class="view-text">{{ row.remaining_quantity }}</span>
            <input class="edit-input" type="number" step="0.1" min="0"
                   value="{{ row.remaining_quantity }}" style="display:none" />
          </td>
          <td>
            <div class="op-cell">
              <button class="btn btn-edit" onclick="toggleEdit(this)">修正</button>
              <button class="btn btn-delete" onclick="deleteRow(this)">削除</button>
            </div>
          </td>
        </tr>
        {% endfor %}
      </tbody>
    </table>
  </div>

  <script>
    function toggleEdit(btn) {
      const tr = btn.closest('tr');
      const isView = tr.dataset.mode === 'view';

      if (isView) {
        tr.dataset.mode = 'edit';
        tr.querySelectorAll('.view-text').forEach(el => el.style.display = 'none');
        tr.querySelectorAll('.edit-input').forEach(el => el.style.display = '');
        btn.textContent = '確定';
        btn.className = 'btn btn-confirm';
      } else {
        const inputs = tr.querySelectorAll('.edit-input');
        const orderInput = inputs[0];
        const remainInput = inputs[1];

        if (!orderInput.value) { alert('注文量を入力してください'); return; }
        if (!isValidDecimal(orderInput.value)) {
          alert('注文量は小数第一位までの数値で入力してください'); return;
        }
        if (remainInput.value !== '' && !isValidDecimal(remainInput.value)) {
          alert('残量は小数第一位までの数値で入力してください'); return;
        }

        const viewTexts = tr.querySelectorAll('.view-text');
        viewTexts[0].textContent = parseFloat(orderInput.value);
        viewTexts[1].textContent = remainInput.value !== '' ? parseFloat(remainInput.value) : '';

        tr.dataset.mode = 'view';
        tr.querySelectorAll('.view-text').forEach(el => el.style.display = '');
        tr.querySelectorAll('.edit-input').forEach(el => el.style.display = 'none');
        btn.textContent = '修正';
        btn.className = 'btn btn-edit';
      }
    }

    function deleteRow(btn) {
      btn.closest('tr').remove();
    }

    function addMonth() {
      const tbody = document.getElementById('table-body');

      // 登録済みの年月から最大値を取得して翌月を自動設定
      const dates = Array.from(document.querySelectorAll('#table-body tr[data-date]'))
                         .map(r => r.dataset.date);
      let nextMonthStr = '';
      if (dates.length > 0) {
        const maxDate = dates.slice().sort().reverse()[0]; // "YYYY/MM/01"
        const [y, m] = maxDate.split('/');
        const next = new Date(parseInt(y), parseInt(m) - 1 + 1, 1);
        const ny = next.getFullYear();
        const nm = String(next.getMonth() + 1).padStart(2, '0');
        nextMonthStr = `${ny}-${nm}`;
      }

      const tr = document.createElement('tr');
      tr.dataset.mode = 'new';
      tr.innerHTML = `
        <td><input type="month" class="month-input" value="${nextMonthStr}" required /></td>
        <td><input type="number" class="order-input" step="0.1" min="0" placeholder="例: 60.0" required /></td>
        <td><input type="number" class="remain-input" step="0.1" min="0" placeholder="空欄可" /></td>
        <td>
          <div class="op-cell">
            <button class="btn btn-confirm" onclick="confirmNew(this)">確定</button>
            <button class="btn btn-delete" onclick="deleteRow(this)">削除</button>
          </div>
        </td>
      `;
      tbody.insertBefore(tr, tbody.firstChild);
      tr.querySelector('.order-input').focus();
    }

    function confirmNew(btn) {
      const tr = btn.closest('tr');
      const monthInput = tr.querySelector('.month-input');
      const orderInput = tr.querySelector('.order-input');
      const remainInput = tr.querySelector('.remain-input');

      if (!monthInput.value) { alert('年月を入力してください'); return; }
      if (!orderInput.value) { alert('注文量を入力してください'); return; }
      if (!isValidDecimal(orderInput.value)) {
        alert('注文量は小数第一位までの数値で入力してください'); return;
      }
      if (remainInput.value !== '' && !isValidDecimal(remainInput.value)) {
        alert('残量は小数第一位までの数値で入力してください'); return;
      }

      const [y, m] = monthInput.value.split('-');
      const dateYm = `${y}/${m}/01`;

      const existing = Array.from(document.querySelectorAll('#table-body tr[data-date]'))
                            .map(r => r.dataset.date);
      if (existing.includes(dateYm)) { alert('すでに登録されている年月です'); return; }

      const orderVal = parseFloat(orderInput.value);
      const remainVal = remainInput.value !== '' ? parseFloat(remainInput.value) : '';

      tr.dataset.mode = 'view';
      tr.dataset.date = dateYm;
      tr.innerHTML = `
        <td class="cell-date">${y}年${parseInt(m)}月</td>
        <td>
          <span class="view-text">${orderVal}</span>
          <input class="edit-input" type="number" step="0.1" min="0" value="${orderVal}" style="display:none" />
        </td>
        <td>
          <span class="view-text">${remainVal}</span>
          <input class="edit-input" type="number" step="0.1" min="0" value="${remainVal}" style="display:none" />
        </td>
        <td>
          <div class="op-cell">
            <button class="btn btn-edit" onclick="toggleEdit(this)">修正</button>
            <button class="btn btn-delete" onclick="deleteRow(this)">削除</button>
          </div>
        </td>
      `;
    }

    async function register() {
      const trs = document.querySelectorAll('#table-body tr');
      const rows = [];

      for (const tr of trs) {
        if (tr.dataset.mode === 'edit') {
          alert('修正中の行があります。確定してから登録してください。'); return;
        }
        if (tr.dataset.mode === 'new') {
          alert('確定されていない行があります。確定してから登録してください。'); return;
        }

        const viewTexts = tr.querySelectorAll('.view-text');
        const remainText = viewTexts[1].textContent.trim();
        rows.push({
          date_ym: tr.dataset.date,
          order_quantity: parseFloat(viewTexts[0].textContent),
          remaining_quantity: remainText !== '' ? parseFloat(remainText) : '',
        });
      }

      // 登録はCSVと同じ昇順で保存
      rows.sort((a, b) => a.date_ym < b.date_ym ? -1 : 1);

      const res = await fetch('/water_demand/save', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ rows }),
      });

      const msg = document.getElementById('msg');
      if (res.ok) {
        msg.style.color = '#16a34a';
        msg.textContent = '登録しました';
        setTimeout(() => { msg.textContent = ''; }, 3000);
      } else {
        msg.style.color = '#dc2626';
        msg.textContent = '登録に失敗しました';
      }
    }

    function isValidDecimal(value) {
      return /^\d+(\.\d{0,1})?$/.test(String(value));
    }
  </script>
</body>
</html>
